<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
  .t{fill:#1f2328} .m{fill:#59636e} .g{stroke:#d1d9e0} .old{fill:#eef1f4} .bad{fill:#ffd9b8} .badt{fill:#7a3b00} .new{fill:#d2f4df} .newt{fill:#0f5323} .fox{fill:#e8772e}
  @media (prefers-color-scheme: dark) {
    .t{fill:#e6edf3} .m{fill:#9198a1} .g{stroke:#3d444d} .old{fill:#262c36} .bad{fill:#5a3310} .badt{fill:#ffc38f} .new{fill:#12391f} .newt{fill:#8ce2a8}
  }
</style>
<text x="0" y="24" class="t" font-size="17" font-weight="600">Что видно на экране между старым и новым словом</text>
<line x1="374.3" y1="52" x2="374.3" y2="212" class="g" stroke-width="1" stroke-dasharray="3 4"/>
<text x="374.3" y="230" class="m" font-size="12" text-anchor="middle">1 кадр</text>
<line x1="488.6" y1="52" x2="488.6" y2="212" class="g" stroke-width="1" stroke-dasharray="3 4"/>
<text x="488.6" y="230" class="m" font-size="12" text-anchor="middle">2 кадра</text>
<line x1="602.9" y1="52" x2="602.9" y2="212" class="g" stroke-width="1" stroke-dasharray="3 4"/>
<text x="602.9" y="230" class="m" font-size="12" text-anchor="middle">3 кадра</text>
<line x1="717.1" y1="52" x2="717.1" y2="212" class="g" stroke-width="1" stroke-dasharray="3 4"/>
<text x="717.1" y="230" class="m" font-size="12" text-anchor="middle">4 кадра</text>
<line x1="260" y1="52" x2="260" y2="212" class="g" stroke-width="1.5"/>
<text x="260" y="230" class="m" font-size="12" text-anchor="middle">0</text>
<text x="0" y="80" class="t" font-size="15" font-weight="600">Стереть и набрать</text>
<text x="0" y="98" class="m" font-size="12">обычный переключатель</text>
<rect x="156" y="62" width="96" height="40" rx="6" class="old"/><text x="204" y="87" class="t" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ghbdtn</text>
<rect x="260" y="62" width="253.7" height="40" rx="4" class="bad"/>
<text x="386.85" y="87" class="badt" font-size="13" text-anchor="middle">слово стёрто: 18,5 мс</text>
<rect x="516.7" y="62" width="96" height="40" rx="6" class="new"/><text x="564.7" y="87" class="newt" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">привет</text>
<text x="0" y="160" class="fox" font-size="15" font-weight="600">LayoutFox</text>
<text x="0" y="178" class="m" font-size="12">одним пакетом</text>
<rect x="156" y="142" width="96" height="40" rx="6" class="old"/><text x="204" y="167" class="t" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ghbdtn</text>
<rect x="260" y="142" width="23.3" height="40" rx="4" class="bad"/>
<rect x="286.3" y="142" width="96" height="40" rx="6" class="new"/><text x="334.3" y="167" class="newt" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">привет</text>
<text x="396.3" y="167" class="m" font-size="13">1,7 мс, вся замена ≈ 5 мс</text>
<text x="260" y="250" class="m" font-size="12">кадры экрана 120 Гц, по 8,3 мс</text>
<text x="0" y="272" class="m" font-size="11.5">Медиана самого долгого промежуточного состояния, 26 и 27 исправлений в текстовом поле macOS, замер 26.09.2026</text>
</svg>
